<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Inventario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> Mi Inventario</h1>
    <div id="resumen-inventario">
        <div class="tarjeta">
            <h2>Total de Productos</h2>
            <p id="total-productos" class="numero azul"></p>
        </div>
        <div class="tarjeta">
            <h2>Total de Unidades</h2>
            <p id="total-unidades" class="numero verde"></p>
        </div>
        <div class="tarjeta">
            <h2>Valor del Inventario</h2>
            <p id="valor-inventario" class="numero morado"></p>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
